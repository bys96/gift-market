name: Deploy API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "giftmarket-api/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gift-market-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy API via SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Gift Market API" \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/gift-market-deploy/scripts/deploy-api.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          MAX_WAIT_SECONDS=1200
          POLL_INTERVAL_SECONDS=10
          START_TIME_SECONDS=${SECONDS}
          LAST_STATUS="Pending"

          print_invocation_logs() {
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
              --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}' \
              || true
          }

          while (( SECONDS - START_TIME_SECONDS < MAX_WAIT_SECONDS )); do
            if CURRENT_STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null); then
              LAST_STATUS="${CURRENT_STATUS}"
              echo "SSM command status: ${LAST_STATUS}"

              case "${LAST_STATUS}" in
                Success)
                  break
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                Failed|Cancelled|TimedOut|Cancelling)
                  echo "Deployment command failed with status: ${LAST_STATUS}"
                  print_invocation_logs
                  exit 1
                  ;;
                *)
                  echo "Deployment command returned an unexpected status: ${LAST_STATUS}"
                  print_invocation_logs
                  exit 1
                  ;;
              esac
            else
              echo "SSM command invocation is not available yet. Retrying..."
            fi

            ELAPSED_SECONDS=$((SECONDS - START_TIME_SECONDS))
            REMAINING_SECONDS=$((MAX_WAIT_SECONDS - ELAPSED_SECONDS))
            if (( REMAINING_SECONDS <= 0 )); then
              break
            fi

            if (( REMAINING_SECONDS < POLL_INTERVAL_SECONDS )); then
              sleep "${REMAINING_SECONDS}"
            else
              sleep "${POLL_INTERVAL_SECONDS}"
            fi
          done

          if [[ "${LAST_STATUS}" != "Success" ]]; then
            if CURRENT_STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null); then
              LAST_STATUS="${CURRENT_STATUS}"
            else
              LAST_STATUS="Unavailable"
            fi

            echo "Deployment command exceeded the 20-minute timeout. Current status: ${LAST_STATUS}"
            print_invocation_logs
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
