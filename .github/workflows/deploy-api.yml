name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "giftmarket-api/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: gift-market-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy API via SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Gift Market API" \
            --parameters 'commands=["sudo -u ubuntu /home/ubuntu/gift-market-deploy/scripts/deploy-api.sh"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          if ! aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}"; then

            echo "Deployment command failed."
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}"

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ vars.AWS_EC2_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'