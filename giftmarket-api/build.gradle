plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.giftmarket'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'io.minio:minio:8.5.17'
	implementation 'software.amazon.awssdk:s3:2.32.33'
	implementation 'software.amazon.awssdk:url-connection-client:2.32.33'
	implementation 'org.jsoup:jsoup:1.23.1'

	compileOnly 'org.projectlombok:lombok'

	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('seedSampleProducts', JavaExec) {
	group = 'application'
	description = 'Dry-runs or creates the one-time sample product seed.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.giftmarket.product.seed.SampleProductSeedApplication'

	def sellerId = providers.gradleProperty('sellerId')
	def dryRun = providers.gradleProperty('dryRun').orElse('true')
	def imageManifest = providers.gradleProperty('imageManifest')

	doFirst {
		if (!sellerId.isPresent()) {
			throw new GradleException('sellerId is required. Example: -PsellerId=1')
		}
		args = [
				"--app.seed.sample-products.seller-id=${sellerId.get()}",
				"--app.seed.sample-products.dry-run=${dryRun.get()}"
		]
		if (imageManifest.isPresent()) {
			args "--app.seed.sample-products.image-manifest=${imageManifest.get()}"
		}
	}
}
