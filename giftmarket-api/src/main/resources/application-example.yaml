spring:
  application:
    name: giftmarket-api

  datasource:
    url: jdbc:mysql://localhost:3306/gift_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: your-google-client-secret
            scope:
              - openid
              - email
              - profile
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080