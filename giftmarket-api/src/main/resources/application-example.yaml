spring:
  application:
    name: giftmarket-api

  datasource:
    url: jdbc:mysql://localhost:3306/gift_market?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

app:
  frontend-url: http://localhost:3000

  jwt:
    # 반드시 환경변수로 등록한다.
    # 최소 32바이트 이상의 값을 Base64로 인코딩한 문자열
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 1800
    refresh-token-expiration-seconds: 1209600
    refresh-cookie-name: gift_refresh_token
    secure-cookie: false

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: info

minio:
  endpoint: http://localhost:9000
  access-key: giftmarket
  secret-key: giftmarket123!
  bucket: gift-market

payment:
  reservation-minutes: 30
  expiration-check-interval-millis: 60000
  expiration-batch-size: 100
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout-millis: 3000
    read-timeout-millis: 10000
