spring:
  application:
    name: giftmarket-api

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 로컬 개발은 update, 운영 배포는 validate를 사용한다.
      ddl-auto: ${JPA_DDL_AUTO:update}

    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  jwt:
    # 반드시 환경변수로 등록한다.
    # 최소 32바이트 이상의 값을 Base64로 인코딩한 문자열
    secret: ${JWT_SECRET}
    access-token-expiration-seconds: 1800
    refresh-token-expiration-seconds: 1209600
    refresh-cookie-name: gift_refresh_token
    secure-cookie: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:debug}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:info}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:gift-market}

payment:
  reservation-minutes: 30
  expiration-check-interval-millis: 60000
  expiration-batch-size: 100
  reconciliation-delay-seconds: 30
  reconciliation-check-interval-millis: 60000
  reconciliation-batch-size: 100
  cancel-reconciliation-delay-seconds: 30
  cancel-reconciliation-check-interval-millis: 60000
  cancel-reconciliation-batch-size: 100
  partial-cancellation-reconciliation-delay-seconds: 30
  partial-cancellation-reconciliation-check-interval-millis: 60000
  partial-cancellation-reconciliation-batch-size: 100
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout-millis: 3000
    read-timeout-millis: 10000
